<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Konfirmasi Pembayaran Produk - Beratidealku</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .info-pesanan-box {
      background-color: #f7f9ff;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 20px;
    }
    .info-pesanan-box p { margin-bottom: 6px; font-size: 14px; }
    .info-pesanan-box .label { color: #495057; font-weight: 600; }
    .info-pesanan-box .nominal { color: #041e55; font-size: 18px; font-weight: 700; }
    #qrCodeBox {
      display: none;
      text-align: center;
      margin-top: 12px;
      padding: 15px;
      background-color: #fff;
      border: 1px dashed #041e55;
      border-radius: 8px;
    }
    #qrCodeBox img { max-width: 260px; height: auto; }
  </style>
</head>
<body>
  <div class="container mt-5 mb-5">
    <div class="card mx-auto shadow" style="max-width: 650px;">
      <div class="card-header text-white" style="background-color: #041e55;">
        <h5 class="mb-0"><i class="fas fa-credit-card"></i> Form Konfirmasi Pembayaran Produk</h5>
      </div>
      <div class="card-body">

        <!-- Info Ringkasan Pesanan (auto dari localStorage / backend) -->
        <div class="info-pesanan-box">
          <h6 class="mb-2"><i class="fas fa-receipt text-primary"></i> Ringkasan Pesanan</h6>
          <p><span class="label">Nomor Pesanan:</span> <span id="ringkasanNoPesanan">-</span></p>
          <p><span class="label">Nama Konsumen:</span> <span id="ringkasanNama">-</span></p>
          <p><span class="label">Sponsor:</span> <span id="ringkasanSponsor">-</span></p>
          <p><span class="label">Alamat:</span> <span id="ringkasanAlamat">-</span></p>
          <p><span class="label">Total Item:</span> <span id="ringkasanTotalItem">-</span></p>
          <p><span class="label">Grand Total Bayar:</span> <span class="nominal" id="ringkasanGrandTotal">Rp. 0</span></p>
        </div>

        <form id="formBayar">
          <!-- Informasi Program / Produk -->
          <div class="mb-4">
            <h6><i class="fas fa-list"></i> Data Pesanan</h6>
            <div class="form-group">
              <label>Tanggal</label>
              <input type="text" class="form-control" id="tanggal" readonly />
            </div>
            <div class="form-group">
              <label>No Pesanan</label>
              <input type="text" class="form-control" id="nomorPesanan" readonly />
            </div>
            <div class="form-group">
              <label>Program / Produk</label>
              <input type="text" class="form-control" id="program" readonly />
            </div>
          </div>

          <!-- Data Pengiriman -->
          <div class="mb-4">
            <h6><i class="fas fa-truck"></i> Data Pengiriman</h6>
            <div class="form-group"><label>Nama</label>      <input type="text"  class="form-control" id="nama" readonly /></div>
            <div class="form-group"><label>Alamat</label>    <input type="text"  class="form-control" id="alamat" readonly /></div>
            <div class="form-group"><label>Telp</label>      <input type="text"  class="form-control" id="telp" readonly /></div>
            <div class="form-group"><label>Email</label>     <input type="email" class="form-control" id="email" readonly /></div>
            <div class="form-group"><label>Kelurahan</label> <input type="text"  class="form-control" id="kelurahan" readonly /></div>
            <div class="form-group"><label>Kecamatan</label> <input type="text"  class="form-control" id="kecamatan" readonly /></div>
            <div class="form-group"><label>Kota</label>      <input type="text"  class="form-control" id="kota" readonly /></div>
            <div class="form-group"><label>Propinsi</label>  <input type="text"  class="form-control" id="propinsi" readonly /></div>
          </div>

          <!-- Informasi Pembayaran -->
          <div class="mb-4">
            <h6><i class="fas fa-money-bill-wave"></i> Informasi Pembayaran</h6>
            <div class="form-group">
              <label>Metode</label>
              <select class="form-control" id="sistemBayar" required>
                <option value="Transfer">Transfer Bank</option>
                <option value="QR Code">QR Code</option>
              </select>
            </div>
            <div id="qrCodeBox">
              <p class="font-weight-bold mb-2">Silahkan Scan QR Code dibawah ini:</p>
              <img id="qrCodeImg" src="" alt="QR Code Pembayaran" onerror="this.style.display='none'" />
              <p class="mt-2 mb-0 text-muted small">QRIS Merchant Beratidealku</p>
            </div>
            <div class="form-group"><label>Nama Penerima</label>    <input type="text" class="form-control" id="namaPenerima" readonly /></div>
            <div class="form-group"><label>AC Penerima</label>      <input type="text" class="form-control" id="acPenerima" readonly /></div>
            <div class="form-group"><label>Nominal Transfer</label> <input type="text" class="form-control" id="nominal" readonly /></div>
          </div>

          <!-- Upload Bukti -->
          <div class="mb-4">
            <label><i class="fas fa-image"></i> Upload Bukti Transfer</label>
            <input type="file" class="form-control-file" id="buktiTransfer" accept="image/*" required />
            <div class="mt-2" id="preview"></div>
          </div>

          <!-- Pesan status -->
          <div id="formMessage" class="mt-3"></div>

          <!-- Tombol Konfirmasi -->
          <div class="text-center">
            <button type="submit" class="btn btn-success w-100" id="btnKonfirmasi">
              <i class="fas fa-paper-plane"></i> Konfirmasi Pembayaran
            </button>
          </div>
        </form>

       <!-- Tampilan Footer pada form -->
        <footer class="section footer-classic context-light mt-2">
          <div class="row row-30 justify-content-center">
            <div>
              Powered By :<a class="brand" href="index.html"><img src="images/logo-beratidealku.png" width="99" height="19"></a>
            </div>
          </div>          
        </footer>

      </div>
    </div>
  </div>

<!-- Custom JS Untuk Load URL public  -->
<script src="js/jsLoadUrlPublic.js"></script>  
<!-- Custom JS Untuk Form Konfirmasi Pembayaran Produk  -->
<script src="js/jsFrmKonfirmasi.js"></script>  

</body>
</html>
