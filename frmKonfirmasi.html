<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Konfirmasi Pembayaran Produk - Beratidealku</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .info-pesanan-box {
      background-color: #f7f9ff;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 20px;
    }
    .info-pesanan-box p { margin-bottom: 6px; font-size: 14px; }
    .info-pesanan-box .label { color: #495057; font-weight: 600; }
    .info-pesanan-box .nominal { color: #041e55; font-size: 14px; font-weight: 600; }
    #qrCodeBox {
      display: none;
      text-align: center;
      margin-top: 12px;
      padding: 15px;
      background-color: #fff;
      border: 1px dashed #041e55;
      border-radius: 8px;
    }
    #qrCodeBox img { max-width: 130px; height: auto; }
    #namaBank { cursor: pointer; }

    /* ===== Kursor Global untuk Input & Tombol (Semua Ukuran Layar) ===== */
    /* Elemen AKTIF / DAPAT DIPILIH → pointer (tangan tunjuk) */
    select:not(:disabled),
    input:not(:disabled),
    textarea:not(:disabled),
    button:not(:disabled),
    .btn:not(:disabled) {
        cursor: pointer;
    }
    select option { cursor: pointer; }

    /* Elemen NON-AKTIF (DISABLED / READONLY) → no-drop (lingkaran larangan) */
    select:disabled,
    input:disabled,
    input[readonly],
    textarea:disabled,
    textarea[readonly],
    button:disabled,
    .btn:disabled {
        cursor: no-drop !important;
    }
  </style>
</head>
<body>
  <div class="container mt-5 mb-5">
    <div class="card mx-auto shadow" style="max-width: 650px;">
      <div class="card-header text-white" style="background-color: #041e55;">
        <h5 class="mb-0"><i class="fas fa-credit-card"></i> Konfirmasi Pembayaran Produk</h5>
      </div>
      <div class="card-body">

        <!-- Info Ringkasan Pesanan (auto dari localStorage / backend) -->
        <div class="info-pesanan-box">
          <h6 class="mb-2"><i class="far fa-file-alt"></i> Ringkasan Pesanan</h6>
          <p><span class="label">Nomor Pesanan :</span> <span id="ringkasanNoPesanan">-</span></p>
          <p><span class="label">Nama Konsumen :</span> <span id="ringkasanNama">-</span></p>
          <p><span class="label">Sponsor :</span> <span id="ringkasanSponsor">-</span></p>
          <p><span class="label">Alamat :</span> <span id="ringkasanAlamat">-</span></p>
          <p><span class="label">Produk :</span> <span id="ringkasanProduk">-</span></p>
          <p><span class="label">Total Item :</span> <span id="ringkasanTotalItem">-</span></p>
          <p><span class="label">Total Bayar :</span> <span class="nominal" id="ringkasanGrandTotal">Rp. 0</span></p>
        </div>

        <form id="formBayar">
          <!-- Informasi Pembayaran -->
          <div class="mb-4">
            <h6><i class="fas fa-money-bill-wave"></i> Informasi Pembayaran</h6>
            <div class="mb-3">
              <label class="form-label">Metode</label>
              <select class="form-select" id="sistemBayar" data-bs-toggle="tooltip" data-bs-placement="top" title="Pilih metode pembayaran">
                <option value="Transfer">Transfer Bank</option>
                <option value="QR Code">QR Code</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Nama Bank</label>
              <select class="form-select" id="namaBank" data-bs-toggle="tooltip" data-bs-placement="top" title="Pilih bank tujuan"></select>
            </div>
            <div id="qrCodeBox">
              <p class="font-weight-bold mb-2">Silahkan Scan QR Code dibawah ini:</p>
              <img id="qrCodeImg" src="" alt="QR Code Pembayaran" onerror="this.style.display='none'" />
              <p class="mt-2 mb-0 text-muted small">QRIS Merchant Beratidealku</p>
              <div class="mt-3 d-flex justify-content-center">
                <a id="btnDownloadQr" href="#" download="QRIS_Beratidealku.jpeg" class="btn btn-sm btn-outline-primary">
                  <i class="fas fa-download me-2"></i>Download QR Code
                </a>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Nama Penerima</label>
              <input type="text" class="form-control" id="namaPenerima" readonly data-bs-toggle="tooltip" data-bs-placement="top" title="Nama rekening penerima" />
            </div>
            <div class="mb-3">
              <label class="form-label">AC Penerima</label>
              <input type="text" class="form-control" id="acPenerima" readonly data-bs-toggle="tooltip" data-bs-placement="top" title="Nomor rekening penerima" />
            </div>
            <div class="mb-3">
              <label class="form-label">Nominal Transfer</label>
              <input type="text" class="form-control" id="nominal" readonly data-bs-toggle="tooltip" data-bs-placement="top" title="Jumlah uang yang ditransfer" />
            </div>
          </div>

          <!-- Upload Bukti -->
          <div class="mb-4" data-bs-toggle="tooltip" data-bs-placement="top" title="Unggah foto/screenshot bukti transfer">
            <label class="form-label"><i class="fas fa-image"></i> Upload Bukti Transfer</label>
            <input type="file" class="form-control form-control-sm" id="buktiTransfer" accept="image/*" title="">
            <div class="mt-2" id="preview"></div>
          </div>

          <!-- Pesan status -->
          <div id="formMessage" class="mt-3"></div>

          <!-- Tombol Konfirmasi -->
          <div class="text-center">
            <button type="submit" class="btn btn-success w-100" id="btnKonfirmasi" data-bs-toggle="tooltip" data-bs-placement="top" title="Klik, untuk konfirmasi pembayaran">
              <i class="fas fa-paper-plane me-2"></i>Konfirmasi Pembayaran
            </button>
          </div> 
        </form>

       <!-- Tampilan Footer pada form -->
        <footer class="section footer-classic context-light mt-2 text-center">
          <div class="d-flex justify-content-center align-items-center">
            <div>
              Powered By :<a class="brand" href="index.html"><img src="images/logo-beratidealku.png" width="99" height="19"></a>
            </div>
          </div>          
        </footer>

      </div>
    </div>
  </div>

<!-- Custom JS Untuk Load URL public  -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/jsLoadUrlPublic.js"></script>  
<!-- Custom JS Untuk Form Konfirmasi Pembayaran Produk  -->
<script src="js/jsFrmKonfirmasi.js"></script>

</body>
</html>
